[project]
name = "automatic-stock-trading"
version = "0.1.0"
description = "Upbit KRW-market scalping analysis, simulation, and guarded auto-trading toolkit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
upbit-scalper = "upbit_scalper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
